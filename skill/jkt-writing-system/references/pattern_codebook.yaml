# JKT_PATTERN_CODEBOOK.yaml
# Version: 1.0
# Purpose: Shared coding ontology for Artefak 1 (Pattern Detection),
#          Artefak 2 (Writing Skill), and Artefak 3 (Style Auditor).

schema_version: "1.0"
system_name: "JKT AI Writing System"
journal_name: "Jurnal Kelautan Tropis"

principles:
  distinguish:
    - editorial_constraint
    - empirical_journal_pattern
    - domain_pattern
    - author_cluster_pattern
    - temporal_pattern
    - language_pattern
  uncertainty_labels:
    - observed
    - inferred
    - provisional
    - unsupported
  pattern_status:
    - hard_constraint
    - core_pattern
    - common_pattern
    - variable_pattern
    - optional_pattern
    - domain_pattern
    - author_cluster
    - temporal_pattern
    - anti_pattern
    - do_not_enforce

pattern_id_prefixes:
  title: "JKT-TITLE"
  abstract: "JKT-ABS"
  introduction: "JKT-INTRO"
  methods: "JKT-METH"
  results: "JKT-RES"
  discussion: "JKT-DISC"
  conclusion: "JKT-CONC"
  citation: "JKT-CIT"
  references: "JKT-REF"
  language: "JKT-LING"
  coherence: "JKT-COH"
  anti_pattern: "JKT-ANTI"

evidence_source_types:
  - guideline
  - corpus
  - domain
  - author_cluster
  - temporal_comparison
  - language_comparison

pattern_types:
  - structural
  - rhetorical
  - linguistic
  - citational
  - evidential
  - procedural
  - argumentative
  - statistical
  - referential
  - coherence

confidence_levels:
  very_high:
    label: "VERY_HIGH"
    guidance: "Stable across years, domains, and author groups with adequate corpus support."
  high:
    label: "HIGH"
    guidance: "Strongly supported with limited exceptions."
  moderate:
    label: "MODERATE"
    guidance: "Useful but context dependent."
  low:
    label: "LOW"
    guidance: "Do not enforce."
  insufficient:
    label: "INSUFFICIENT"
    guidance: "Evidence inadequate for journal-level inference."

frequency_classes:
  core:
    min_percent: 80
    label: "CORE"
  common:
    min_percent: 60
    max_percent: 79.999
    label: "COMMON"
  variable:
    min_percent: 30
    max_percent: 59.999
    label: "VARIABLE"
  rare:
    min_percent: 0
    max_percent: 29.999
    label: "RARE"

article_metadata_fields:
  - article_id
  - title
  - year
  - volume
  - issue
  - pages
  - doi
  - language
  - article_type
  - research_domain
  - research_object
  - study_location
  - method_family
  - data_type
  - number_of_authors
  - first_author
  - corresponding_author
  - institution
  - sections_present

domains:
  MARBIO: "Marine Biology"
  MARECO: "Marine Ecology"
  FISH: "Marine Fisheries"
  OCEAN: "Oceanography"
  POLL: "Marine Pollution"
  RS: "Remote Sensing"
  MICRO: "Marine Microbiology"
  COAST: "Coastal Management"
  GEO: "Marine Geology/Geodesy"
  OTHER: "Other marine science"

units_of_analysis:
  - document
  - section
  - paragraph
  - sentence
  - clause
  - phrase
  - citation
  - data_object

title_archetypes:
  T1: "Variable + Object + Location"
  T2: "Relationship X-Y + Object + Location"
  T3: "Effect of X on Y"
  T4: "Distribution/Abundance of X"
  T5: "Biological/Ecological Characteristic of X"
  T6: "Assessment/Evaluation of X"
  T7: "Method/Application + Target"
  T8: "Temporal/Spatial Dynamics of X"
  T9: "Predictive/Modeling Title"
  T10: "Other recurrent structure"

abstract_moves:
  AB-BG: "Background"
  AB-PB: "Problem"
  AB-GAP: "Research gap"
  AB-OBJ: "Objective"
  AB-MET: "Method"
  AB-DAT: "Data/sample description"
  AB-RES: "Result"
  AB-INT: "Interpretation"
  AB-CON: "Conclusion"
  AB-IMP: "Implication"

introduction_moves:
  I1.1: "Ecological importance"
  I1.2: "Economic importance"
  I1.3: "Management importance"
  I1.4: "Biological significance"
  I1.5: "Environmental significance"
  I1.6: "General scientific context"
  I2.1: "Species context"
  I2.2: "Ecosystem context"
  I2.3: "Geographic context"
  I2.4: "Environmental condition"
  I2.5: "Fisheries context"
  I2.6: "Specific phenomenon"
  I3.1: "Environmental pressure"
